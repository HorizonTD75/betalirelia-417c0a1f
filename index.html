        "/": '<main><h1>LirElia – Basse Vision : Bilans, Aides Visuelles &amp; Accompagnement</h1><p>Accompagnement expert en basse vision, DMLA et glaucome. Retrouvez votre autonomie grâce à nos bilans fonctionnels et aides à la lecture à Paris.</p><nav aria-label="Parcours"><h2>Votre parcours commence ici</h2><ul><li><a href="/comprendre-basse-vision">Comprendre la basse vision</a> – Définition, causes et premiers repères pour agir.</li><li><a href="/bilans-bassevision">Nos bilans basse vision</a> – Évaluation complète de vos capacités visuelles.</li><li><a href="/aides-lecture-bassevision">Aides à la lecture</a> – Loupes, lampes, télé-agrandisseurs et solutions numériques.</li><li><a href="/maladies-yeux">Maladies des yeux</a> – DMLA, glaucome, cataracte, rétinite pigmentaire et plus.</li></ul></nav><section><h2>Nos bilans basse vision</h2><p>Trois formules adaptées à vos besoins : Bilan Essentiel, Bilan Expert et Bilan de Suivi. Chaque bilan comprend une évaluation fonctionnelle de votre vision, des essais d\'aides adaptées et un plan d\'action personnalisé.</p></section><section><h2>Aides à la lecture et produits</h2><p>Loupes en verre, loupes électroniques, lampes adaptées et télé-agrandisseurs : découvrez notre sélection de produits choisis pour leur qualité et leur adaptation aux besoins des personnes malvoyantes.</p></section><section><h2>Témoignages</h2><p>Des centaines de personnes ont retrouvé le plaisir de lire grâce à nos bilans et nos aides visuelles adaptées.</p></section><section><h2>Nous contacter</h2><p>Besoin d\'un conseil personnalisé ? Contactez-nous pour un échange gratuit et sans engagement. Téléphone : 07 68 47 42 35.</p></section></main>',

        "/comprendre-basse-vision": '<main><h1>Comprendre la Basse Vision – Causes, Définition et Repères</h1><p>La basse vision désigne une déficience visuelle qui ne peut pas être entièrement corrigée par des lunettes, des lentilles ou une chirurgie. Elle touche des centaines de milliers de personnes en France, principalement à cause de maladies comme la DMLA, le glaucome ou la rétinite pigmentaire.</p><section><h2>Qu\'est-ce que la basse vision ?</h2><p>On parle de basse vision lorsque l\'acuité visuelle du meilleur œil, après correction, est inférieure à 3/10. Cette condition affecte la capacité à lire, reconnaître les visages, se déplacer et réaliser les activités du quotidien.</p></section><section><h2>Les causes principales</h2><p>Les principales pathologies responsables de la basse vision sont la <a href="/maladies-yeux/dmla">DMLA (dégénérescence maculaire liée à l\'âge)</a>, le <a href="/maladies-yeux/glaucome">glaucome</a>, la <a href="/maladies-yeux/cataracte">cataracte</a> non opérée, la <a href="/maladies-yeux/retinopathie-diabetique">rétinopathie diabétique</a> et la <a href="/maladies-yeux/retinite-pigmentaire">rétinite pigmentaire</a>.</p></section><section><h2>Les signes qui doivent alerter</h2><ul><li>Difficulté à lire le journal même avec des lunettes</li><li>Difficulté à reconnaître les visages à distance</li><li>Éblouissement fréquent</li><li>Fatigue visuelle intense</li><li>Perte de confiance pour les déplacements</li></ul></section><section><h2>Que faire face à la basse vision ?</h2><p>Un <a href="/bilans-bassevision">bilan basse vision</a> permet d\'évaluer précisément vos capacités visuelles résiduelles et de vous orienter vers les <a href="/aides-lecture-bassevision">aides à la lecture</a> les mieux adaptées. Un <a href="/expert-basse-vision-visiopraticien">visiopraticien</a> vous accompagne dans cette démarche.</p></section></main>',

        "/bilans-bassevision": '<main><h1>Bilans Basse Vision – Évaluation et Accompagnement</h1><p>Nos bilans basse vision permettent d\'évaluer précisément vos capacités visuelles résiduelles et de vous proposer des solutions adaptées pour retrouver votre autonomie de lecture et vos activités quotidiennes.</p><section><h2>Nos trois formules de bilans</h2><article><h3>Bilan Essentiel</h3><p>La formule de base pour faire le point sur votre basse vision. Séance individuelle d\'1h15 à 1h30 comprenant une évaluation de la vision fonctionnelle, des essais d\'aides adaptées, un compte-rendu synthétique et un plan d\'action clair.</p></article><article><h3>Bilan Expert</h3><p>Bilan Essentiel complété par une consultation opticien-optométriste. Compte-rendu détaillé et recommandations approfondies pour une prise en charge complète.</p></article><article><h3>Bilan de Suivi</h3><p>Accompagnement continu pour adapter vos aides visuelles dans le temps et maintenir votre autonomie face à l\'évolution de votre vue.</p></article></section><section><h2>Bilan à domicile</h2><p>Nous proposons également des <a href="/bilans-bassevision/visites-domicile">bilans basse vision à domicile</a> pour les personnes qui ne peuvent pas se déplacer. L\'évaluation se fait directement dans votre environnement habituel.</p></section><section><h2>Prendre rendez-vous</h2><p><a href="/rdv-bilan">Prenez rendez-vous</a> pour un bilan personnalisé avec un visiopraticien LirElia. Nous intervenons à Paris et en Île-de-France.</p></section></main>',

        "/maladies-yeux": '<main><h1>Maladies des Yeux et Basse Vision</h1><p>Découvrez les principales maladies des yeux responsables de la basse vision. Chaque pathologie est expliquée de manière accessible : causes, symptômes, traitements et conseils pour vivre au mieux avec une déficience visuelle.</p><section><h2>Maladies dégénératives</h2><ul><li><a href="/maladies-yeux/dmla">La DMLA</a> – Dégénérescence maculaire liée à l\'âge, première cause de malvoyance après 50 ans.</li><li><a href="/maladies-yeux/glaucome">Le Glaucome</a> – Atteinte du nerf optique souvent liée à une pression intraoculaire élevée.</li><li><a href="/maladies-yeux/cataracte">La Cataracte</a> – Opacification du cristallin, très fréquente après 60 ans.</li><li><a href="/maladies-yeux/retinopathie-diabetique">La Rétinopathie diabétique</a> – Complication oculaire du diabète touchant les vaisseaux de la rétine.</li><li><a href="/maladies-yeux/retinite-pigmentaire">La Rétinite pigmentaire</a> – Maladie génétique progressive affectant les photorécepteurs de la rétine.</li></ul></section><section><h2>Troubles de la réfraction</h2><ul><li><a href="/maladies-yeux/myopie">La Myopie</a> – Vision floue de loin, en augmentation dans le monde.</li><li><a href="/maladies-yeux/hypermetropie">L\'Hypermétropie</a> – Difficulté à voir de près, parfois associée à la fatigue visuelle.</li><li><a href="/maladies-yeux/astigmatisme">L\'Astigmatisme</a> – Vision déformée due à une courbure irrégulière de la cornée.</li><li><a href="/maladies-yeux/presbytie">La Presbytie</a> – Perte progressive de la vision de près après 40 ans.</li></ul></section><section><h2>Troubles oculomoteurs</h2><ul><li><a href="/maladies-yeux/nystagmus">Le Nystagmus</a> – Mouvements involontaires et répétitifs des yeux.</li></ul></section><section><h2>Maladies héréditaires et génétiques</h2><p><a href="/maladies-yeux/maladies-hereditaires">Découvrez les maladies héréditaires de l\'œil</a> : rétinite pigmentaire, maladie de Stargardt, maladie de Leber, achromatopsie, syndrome d\'Usher et aniridie.</p></section></main>'
